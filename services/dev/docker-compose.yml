# Nippan AI Platform — Development Stack
# n8n + PostgreSQL for Phase A market test (Step 0)
# Start: cd services/dev && docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    container_name: nippan-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: nippan_dev
      POSTGRES_USER: nippan
      POSTGRES_PASSWORD: change-me-in-production
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nippan_pgdata:/var/lib/postgresql/data
      - ./backup:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nippan -d nippan_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: nippan-n8n-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_DATABASE: "nippan_dev"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: "nippan"
      DB_POSTGRESDB_PASSWORD: "change-me-in-production"
      WEBHOOK_URL: "http://localhost:5678/"
      GENERIC_TIMEZONE: "Asia/Bangkok"
      N8N_ENCRYPTION_KEY: "change-me-in-production"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - nippan_n8ndata:/home/node/.n8n
    links:
      - postgres

volumes:
  nippan_pgdata:
  nippan_n8ndata:
