[project]
name = "nippan-core"
version = "0.1.0"
description = "Nippan AI Platform Core Runtime Skeleton"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "anyio>=4.4,<5",
  "pytest>=8.4,<9",
  "jsonschema>=4.24,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]
