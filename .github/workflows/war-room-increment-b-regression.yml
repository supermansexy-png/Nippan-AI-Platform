name: War Room Increment B PostgreSQL regression

on:
  pull_request:
    branches:
      - war-room/increment-b-schema-implementation
  push:
    branches:
      - war-room/increment-b-schema-implementation
  workflow_dispatch:

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations in lexical timestamp order
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end
          $$;
          SQL
          for file in migrations/*.sql; do
            echo "APPLY $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run War Room Increment B invariants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/war_room_increment_b_invariants.sql
      - name: Record PostgreSQL schema, RLS, policy, ACL and function inventory
        run: |
          set -euo pipefail
          psql -X -P pager=off -c 'select version();'
          psql -X -P pager=off -c "select count(*) as war_room_tables from information_schema.tables where table_schema = 'public' and table_name like 'project_room_%';"
          psql -X -P pager=off -c "select c.relname, c.relrowsecurity, c.relforcerowsecurity from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname like 'project_room_%' and c.relkind in ('r','p') order by c.relname;"
          psql -X -P pager=off -c "select schemaname, tablename, policyname, roles, cmd from pg_policies where schemaname = 'public' and tablename like 'project_room_%' order by tablename, policyname;"
          psql -X -P pager=off -c "select rolname, rolsuper, rolbypassrls from pg_roles where rolname in ('nippan_runtime','nippan_control_plane','nippan_analytics') order by rolname;"
          psql -X -P pager=off -c "select n.nspname, p.proname, p.prosecdef, p.proowner::regrole, p.proconfig from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'app_private' and p.proname like '%project_room%' order by p.proname;"
          psql -X -P pager=off -c "select grantee, table_name, privilege_type from information_schema.role_table_grants where table_schema = 'public' and table_name like 'project_room_%' and grantee in ('nippan_runtime','nippan_control_plane','nippan_analytics','anon','authenticated','service_role') order by grantee, table_name, privilege_type;"
      - name: Prove intentional privilege regression is detected, then restore clean state
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'grant update on public.project_room_messages to nippan_runtime;'
          set +e
          psql -v ON_ERROR_STOP=1 -f tests/sql/war_room_increment_b_invariants.sql
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Intentional forbidden UPDATE grant was not detected'
            exit 1
          fi
          echo "Expected negative-control failure detected with exit code $result"
          psql -v ON_ERROR_STOP=1 -c 'revoke update on public.project_room_messages from nippan_runtime;'
          psql -v ON_ERROR_STOP=1 -f tests/sql/war_room_increment_b_invariants.sql
      - name: Fresh database reapply and clean suite rerun
        shell: bash
        run: |
          set -euo pipefail
          db=war_room_reapply
          dropdb --if-exists "$db"
          createdb "$db"
          trap 'PGDATABASE=postgres dropdb --if-exists "$db"' EXIT
          export PGDATABASE="$db"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end
          $$;
          SQL
          for file in migrations/*.sql; do
            echo "REAPPLY $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -f tests/sql/war_room_increment_b_invariants.sql
      - name: Verify no prototype migration path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/war-room/migrations/0001_war_room_sandbox.sql
