project: nippan-ai-platform
status: phase_a_market_test
date: 2026-09-24

principles:
  easy_to_operate: true
  easy_to_debug: true
  cost_efficient: true
  flexible: true
  extensible: true
  complexity_requires_evidence: true
  simple_setup: true

product_model:
  multi_tenant: true
  target: small_thai_businesses_bot_rental
  tenant_ceiling_phase_a: 30
  price_thb_per_bot_per_month: 299
  channels:
    - line_oa_owned_by_tenant
    - web_chat
  supports:
    - chat_bots
    - secretary_bots
    - future_underserved_segments
  hierarchy:
    - tenant
    - bot
    - channel
    - end_customer
    - conversation

architecture:
  phase: A
  runtime_core: n8n
  model_gateway: openrouter
  model_gateway_exclusive: false
  system_of_record: self_hosted_postgresql_lite_schema
  vector_memory: none_yet
  retrieval: keyword
  tool_interface: mcp_tools
  full_stack_blueprint: docs/future/

customer_facing_rules:
  never_reveal_model: true
  never_claim_human: true
  config_is_fixed_menu_only: true
  see: docs/product/CUSTOMER_FACING_RULES.md

war_room:
  roles:
    - project_lead
    - developer
    - mcp_tool_builder
    - auditor
    - cost_guard
    - onboarding_agent
    - support_agent
    - marketing
    - model_scout
  activation_order: docs/warroom/ROLES.md
  autonomy_ladder: docs/warroom/ROLES.md
  monitoring: docs/warroom/MONITORING.md
  decision_log: docs/warroom/DECISION_LOG_FORMAT.md

pdpa:
  tenant_is_data_controller: true
  platform_is_data_processor: true
  never_train_on_tenant_data_without_consent: true
  cross_tenant_leakage_forbidden: true
  see: docs/security/PDPA_COMPLIANCE.md

scope_keys:
  - tenant_id
  - bot_id
  - channel_id
  - end_customer_id

work_control:
  task_board: TASKS.md
  rules: docs/warroom/TASK_CONTROL.md
  risk_levels: [L1, L2, L3]
  wip_limit_in_progress: 3

deferred_to_future:
  - fastapi_core_service
  - cloudflare_worker_edge
  - postgresql_pgvector_rls
  - control_plane_dashboard
  - saas_billing_metering
  - formal_mcp_hub
  - see: docs/future/README.md

protected_systems:
  ai_nippan:
    repository: supermansexy-png/Ai-Nippan
    production: true
    migrate_now: false
  personal_line_assistant:
    production: true
    migrate_now: false

current_phase:
  name: phase_a_market_test
  production_migration_allowed: false
  next_gate: first_tenant_onboarded
